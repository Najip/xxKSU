name: Release
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: ""
      release_notes:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave blank to auto-generate)"
        required: false
        type: string
        default: ""
      release_notes:
        description: "Release notes (the Sync xxKSU workflow fills this in)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Pre-release (newest xxKSU, not yet built on the A32). Promote xxKSU makes it the Latest release"
        required: false
        type: boolean
        default: false
      dispatch_kernel:
        description: "Afterwards start the A32 kernel pre-release build (needs KERNEL_DISPATCH_TOKEN)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" && "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          fi
          if [[ -z "$tag" ]]; then
            tag="v3.3.1-xx-$(date -u +%Y%m%d)-${GITHUB_SHA:0:8}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ inputs.prerelease != true }}
          files: |
            manager/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*

  dispatch-kernel:
    needs: release
    if: inputs.dispatch_kernel
    runs-on: ubuntu-latest
    steps:
      # The kernel repo's upstream check sees the new xxKSU release and builds
      # only the xxKSU kernel (as a pre-release), reusing the BakaSU one.
      - name: Start the A32 kernel upstream check (when KERNEL_DISPATCH_TOKEN is set)
        env:
          GH_TOKEN: ${{ secrets.KERNEL_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "KERNEL_DISPATCH_TOKEN not set; the kernel repo's upstream check picks this up."
            exit 0
          fi
          gh workflow run upstream-check.yml --repo Najip/KernelSU_SUSFS_Samsung_SM-A325X -f build=true
